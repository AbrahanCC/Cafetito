<div class="dashboard-page">

  <div class="dashboard-hero mb-4">

    <div>
      <span class="dashboard-pill">Módulo Peso Cabal</span>

      <h1 class="dashboard-title">
        Panel de Peso Cabal
      </h1>

      <p class="dashboard-subtitle">
        Registra pesos de báscula, consulta parcialidades pesadas y genera boletas.
      </p>
    </div>

  </div>

  <div class="row g-4">

    <div class="col-md-4" *ngFor="let item of tarjetas">

      <div class="dashboard-card">

        <div class="card-icon">
          <span *ngIf="item.titulo === 'Cuentas'">📄</span>
          <span *ngIf="item.titulo === 'Parcialidades pendientes'">⚖️</span>
          <span *ngIf="item.titulo === 'Boletas'">🧾</span>
        </div>

        <h4>{{ item.titulo }}</h4>

        <p>
          {{ item.descripcion }}
        </p>

        <a
          class="btn btn-dashboard"
          [routerLink]="item.ruta"
          [queryParams]="item.queryParams">
          Entrar
        </a>

      </div>

    </div>

  </div>

</div>
